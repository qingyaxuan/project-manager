<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目检索面板 — Project Manager</title>
<style>
/* ========== CSS Variables ========== */
:root {
  --bg-primary: #0a0a12;
  --bg-secondary: #111122;
  --bg-card: #16162b;
  --bg-card-hover: #1d1d38;
  --border: #232348;
  --text-primary: #e8e8f2;
  --text-secondary: #9292b8;
  --text-muted: #5c5c80;
  --accent: #7258f5;
  --accent-glow: rgba(114, 88, 245, 0.22);
  --accent-2: #2ed8a3;
  --accent-3: #f5a623;
  --accent-4: #4da6ff;
  --danger: #f5506e;
  --status-completed: #2ed8a3;
  --status-active: #4da6ff;
  --status-archived: #5c5c80;
  --radius: 12px;
  --radius-sm: 7px;
  --transition: 0.2s ease;
}

/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.6;
  min-height:100vh;
}

/* Subtle animated bg */
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 10%,rgba(114,88,245,0.08) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 80%,rgba(46,216,163,0.05) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}

/* ========== Layout ========== */
.container{max-width:1240px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* ========== Header ========== */
.header{
  background:rgba(17,17,34,0.85);
  border-bottom:1px solid var(--border);
  padding:16px 0;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-size:1.2rem;font-weight:700;white-space:nowrap;
}
.logo-icon{
  width:38px;height:38px;
  background:linear-gradient(135deg,var(--accent),#a78bfa);
  border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  box-shadow:0 0 20px var(--accent-glow);
}
.search-wrap{flex:1;max-width:500px;position:relative}
.search-wrap input{
  width:100%;padding:10px 16px 10px 42px;
  border-radius:24px;
  border:1px solid var(--border);
  background:var(--bg-card);
  color:var(--text-primary);
  font-size:0.95rem;outline:none;
  transition:var(--transition);
}
.search-wrap input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}
.search-wrap input::placeholder{color:var(--text-muted)}
.search-icon{
  position:absolute;left:14px;top:50%;
  transform:translateY(-50%);color:var(--text-muted);
  pointer-events:none;font-size:1rem;
}

/* ========== Header Buttons ========== */
.btn-add{
  padding:8px 16px;border-radius:20px;
  border:1px solid var(--accent-2);background:rgba(46,216,163,0.1);
  color:var(--accent-2);font-size:0.84rem;cursor:pointer;
  transition:var(--transition);white-space:nowrap;font-weight:500;
}
.btn-add:hover{background:var(--accent-2);color:#000}
.btn-refresh{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-secondary);font-size:0.9rem;cursor:pointer;
  transition:var(--transition);display:flex;align-items:center;justify-content:center;
  padding:0;line-height:1;
}
.btn-refresh:hover{border-color:var(--accent);color:var(--accent)}
.btn-refresh.spinning{animation:spin 0.6s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.last-updated{
  font-size:0.72rem;color:var(--text-muted);white-space:nowrap;
}

/* ========== Form Modal ========== */
.form-group{margin-bottom:14px}
.form-group label{
  display:block;font-size:0.78rem;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;
}
.form-group input, .form-group textarea, .form-group select{
  width:100%;padding:9px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-primary);font-size:0.9rem;outline:none;
  transition:var(--transition);font-family:inherit;
}
.form-group textarea{resize:vertical;min-height:70px}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);
}
.form-group .hint{font-size:0.72rem;color:var(--text-muted);margin-top:3px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:4px;min-height:34px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-card);cursor:text;align-items:center;
}
.tag-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.tag-input-wrap .tag-item{
  display:flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:10px;font-size:0.76rem;
  background:rgba(114,88,245,0.15);color:#b19ef7;
}
.tag-input-wrap .tag-item .tag-remove{
  cursor:pointer;font-size:0.9rem;line-height:1;color:var(--text-muted);
}
.tag-input-wrap .tag-item .tag-remove:hover{color:var(--danger)}
.tag-input-wrap input{border:none!important;background:transparent!important;
  color:var(--text-primary)!important;font-size:0.84rem!important;
  outline:none!important;flex:1;min-width:80px;padding:2px 4px!important;
  box-shadow:none!important;
}

/* ========== Card Edit/Delete Actions ========== */
.card-edit-btn, .card-del-btn{
  padding:3px 10px;border-radius:10px;border:none;
  font-size:0.7rem;cursor:pointer;transition:var(--transition);
  opacity:0;background:transparent;
}
.project-card:hover .card-edit-btn,
.project-card:hover .card-del-btn{opacity:1}
.card-edit-btn{color:var(--accent-4)}
.card-edit-btn:hover{background:rgba(77,166,255,0.1)}
.card-del-btn{color:var(--danger)}
.card-del-btn:hover{background:rgba(245,80,110,0.1)}

/* ========== Stats Bar ========== */
.stats-bar{display:flex;gap:14px;padding:22px 0;flex-wrap:wrap}
.stat-card{
  flex:1;min-width:110px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 22px;text-align:center;
  transition:var(--transition);
  cursor:default;
}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.stat-number{
  font-size:2.2rem;font-weight:700;
  background:linear-gradient(135deg,var(--accent),#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.stat-label{font-size:0.78rem;color:var(--text-secondary);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}

/* ========== Filters ========== */
.filter-bar{
  display:flex;gap:8px;padding:0 0 18px;flex-wrap:wrap;align-items:center;
}
.filter-label{
  font-size:0.78rem;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:0.5px;margin-right:2px;
}
.chip{
  padding:6px 16px;border-radius:20px;
  border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-secondary);
  font-size:0.84rem;cursor:pointer;transition:var(--transition);
  white-space:nowrap;user-select:none;
}
.chip:hover{border-color:var(--accent);color:var(--text-primary)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view-toggle{
  display:flex;gap:3px;margin-left:auto;
  background:var(--bg-card);border-radius:22px;
  padding:3px;border:1px solid var(--border);
}
.view-btn{
  padding:7px 16px;border-radius:20px;border:none;
  background:transparent;color:var(--text-secondary);
  cursor:pointer;font-size:0.84rem;transition:var(--transition);
}
.view-btn.active{background:var(--accent);color:#fff}

/* ========== Project Grid ========== */
.project-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:16px;padding-bottom:40px;
}
.project-grid.hidden{display:none}
.project-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 22px;
  transition:var(--transition);
  display:flex;flex-direction:column;gap:12px;
  cursor:pointer;
}
.project-card:hover{
  border-color:var(--accent);
  box-shadow:0 4px 28px var(--accent-glow);
  transform:translateY(-3px);
}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-title{font-size:1.08rem;font-weight:600;color:var(--text-primary)}
.card-status{
  font-size:0.68rem;padding:3px 10px;border-radius:12px;
  font-weight:500;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;
}
.status-completed{background:rgba(46,216,163,0.13);color:var(--status-completed)}
.status-in-progress{background:rgba(77,166,255,0.13);color:var(--status-active)}
.status-archived{background:rgba(92,92,128,0.13);color:var(--status-archived)}
.card-desc{
  font-size:0.86rem;color:var(--text-secondary);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.5;
}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  padding:3px 10px;border-radius:12px;font-size:0.73rem;font-weight:500;
  background:rgba(114,88,245,0.1);color:#b19ef7;
}
.tag.tech{background:rgba(77,166,255,0.1);color:#80c4ff}
.card-actions{
  display:flex;gap:8px;margin-top:auto;padding-top:10px;
  border-top:1px solid var(--border);
}
.card-actions button{
  flex:1;padding:7px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  color:var(--text-secondary);font-size:0.8rem;
  cursor:pointer;transition:var(--transition);
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.card-actions button:hover{
  border-color:var(--accent);color:var(--text-primary);
  background:rgba(114,88,245,0.06);
}
.card-actions button.primary-action:hover{
  border-color:var(--accent-2);color:var(--accent-2);
  background:rgba(46,216,163,0.06);
}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  font-size:0.76rem;color:var(--text-muted);
}
.card-category{
  padding:2px 8px;border-radius:4px;font-size:0.7rem;
  background:var(--bg-secondary);text-transform:uppercase;letter-spacing:0.5px;
}

/* ========== Timeline ========== */
.timeline-view{display:none;padding-bottom:40px}
.timeline-view.active{display:block}
.timeline-year{margin-bottom:28px}
.timeline-year-header{
  font-size:1.5rem;font-weight:700;color:var(--accent);
  margin-bottom:14px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:baseline;gap:10px;
}
.timeline-year-count{font-size:0.85rem;color:var(--text-muted);font-weight:400}
.timeline-items{position:relative;padding-left:32px}
.timeline-items::before{
  content:'';position:absolute;left:9px;top:4px;bottom:4px;
  width:2px;background:var(--border);
}
.timeline-item{
  position:relative;padding:14px 18px;margin-bottom:8px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);transition:var(--transition);
  cursor:pointer;
}
.timeline-item:hover{
  border-color:var(--accent);
  box-shadow:0 2px 16px var(--accent-glow);
}
.timeline-item::before{
  content:'';position:absolute;left:-27px;top:20px;
  width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg-primary);
}
.timeline-date{font-size:0.78rem;color:var(--accent);font-weight:500;margin-bottom:4px}
.timeline-item .card-title{font-size:1rem}
.timeline-item .card-desc{-webkit-line-clamp:1}
.timeline-actions{display:flex;gap:8px;margin-top:10px}
.timeline-actions button{
  padding:5px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  color:var(--text-secondary);font-size:0.76rem;
  cursor:pointer;transition:var(--transition);
  display:flex;align-items:center;gap:4px;
}
.timeline-actions button:hover{
  border-color:var(--accent);color:var(--text-primary);
}

/* ========== Modal ========== */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.65);z-index:200;
  align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius);padding:30px;
  max-width:620px;width:90%;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal h2{font-size:1.4rem;margin-bottom:4px}
.modal .modal-desc{color:var(--text-secondary);margin-bottom:20px;font-size:0.92rem}
.modal-section{margin-bottom:16px}
.modal-section h3{
  font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--text-muted);margin-bottom:8px;
}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.modal-actions button, .modal-actions a{
  padding:9px 20px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--bg-card);
  color:var(--text-primary);font-size:0.88rem;
  cursor:pointer;transition:var(--transition);
  text-decoration:none;display:flex;align-items:center;gap:6px;
}
.modal-actions .btn-primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
.modal-actions .btn-primary:hover{box-shadow:0 0 16px var(--accent-glow)}
.modal-close{
  position:absolute;top:14px;right:18px;
  background:none;border:none;color:var(--text-muted);
  font-size:1.5rem;cursor:pointer;padding:4px 8px;
}
.modal-close:hover{color:var(--text-primary)}

/* ========== Toast ========== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--accent-2);color:#000;padding:10px 22px;
  border-radius:24px;font-size:0.85rem;font-weight:500;
  opacity:0;transition:opacity 0.3s;z-index:300;
  pointer-events:none;
}
.toast.show{opacity:1}

/* ========== Empty ========== */
.empty-state{
  text-align:center;padding:80px 20px;color:var(--text-muted);
}
.empty-icon{font-size:5rem;margin-bottom:16px;opacity:0.3}
.empty-title{font-size:1.3rem;color:var(--text-secondary);margin-bottom:8px}
.empty-desc{font-size:0.9rem}

/* ========== Responsive ========== */
@media (max-width:768px){
  .header-inner{flex-direction:column;align-items:stretch}
  .search-wrap{max-width:100%}
  .project-grid{grid-template-columns:1fr;gap:12px}
  .stats-bar{gap:8px}
  .stat-card{padding:12px 14px}
  .stat-number{font-size:1.6rem}
  .view-toggle{margin-left:0}
  .modal{padding:20px}
}
</style>
</head>
<body>

<!-- ========== Header ========== -->
<header class="header">
  <div class="container header-inner">

        <button class="btn-refresh" onclick="refreshData()" title="刷新数据" id="btnRefresh">🔄</button>
        <span class="last-updated" id="lastUpdated"></span>
        <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索项目名称、描述、技术栈…" autocomplete="off">

<main class="container">

    </div>
  </div>

  <!-- Grid -->
  <div class="project-grid" id="projectGrid"></div>
  <!-- Timeline -->

<!-- ========== Detail Modal ========== -->

</div>

<div class="toast" id="toast"></div>

<script>
// ========== State ==========
const API_BASE = window.location.origin;
const DATA_URL = API_BASE + '/api/projects';
let projects = [];
let metadata = {};
let activeFilter = 'all';
let activeView = 'grid';

// ========== Data Load ==========
async function loadData() {
  let fromNetwork = false;
  try {
    const resp = await fetch(DATA_URL);
    if (resp.ok) {
      const data = await resp.json();
      projects = data.projects || [];
      metadata = data.metadata || {};
      fromNetwork = true;
    }
  } catch (err) {
    console.warn('API fetch failed:', err.message);
  }

  // Fallback to embedded data (for file:// access)
  if (!fromNetwork) {
    try {
      const el = document.getElementById('embedded-data');
      if (el && el.textContent.trim()) {
        const data = JSON.parse(el.textContent.trim());
        projects = data.projects || [];
        metadata = data.metadata || {};
      }
    } catch (e) {
      console.warn('Embedded data parse failed:', e.message);
    }
  }
}

window.retryLoad = async function() {
  await loadData();
  renderAll();
};

// ========== Render ==========
function renderStats() {
  const total = projects.length;
  const cats = {};
  const statuses = { completed: 0, 'in-progress': 0, archived: 0 };
  projects.forEach(p => {
    cats[p.category] = (cats[p.category] || 0) + 1;
    if (statuses[p.status] !== undefined) statuses[p.status]++;
  });
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">项目总数</div></div>
    <div class="stat-card"><div class="stat-number">${statuses['completed']}</div><div class="stat-label">已完成</div></div>
    <div class="stat-card"><div class="stat-number">${statuses['in-progress']}</div><div class="stat-label">进行中</div></div>
    <div class="stat-card"><div class="stat-number">${Object.keys(cats).length}</div><div class="stat-label">分类数</div></div>
  `;
}

function getFiltered() {
  const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  let filtered = [...projects];
  if (activeFilter !== 'all') filtered = filtered.filter(p => p.category === activeFilter);
  if (query) {
    filtered = filtered.filter(p =>
      (p.name||'').toLowerCase().includes(query) ||
      (p.description||'').toLowerCase().includes(query) ||
      (p.techStack||[]).some(t => t.toLowerCase().includes(query)) ||
      (p.tags||[]).some(t => t.toLowerCase().includes(query))
    );
  }
  filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  return filtered;
}

// ========== Action Handlers ==========
async function openProjectDir(location) {
  if (!location) { showToast('该项目未记录目录路径'); return; }
  // Try API first (HTTP server mode)
  try {
    const resp = await fetch(API_BASE + '/api/open?path=' + encodeURIComponent(location));
    if (resp.ok) { return; } // Server opened the folder
  } catch(e) { /* fall through */ }
  // Fallback: file:// protocol (file:// mode or API failed)
  const url = 'file:///' + location.replace(/\\/g, '/');
  const w = window.open(url, '_blank');
  if (!w) { copyToClipboard(location); showToast('路径已复制: ' + location); }
}

async function continueProject(name, location) {
  try {
    const params = new URLSearchParams({ name, path: location || '' });
    const resp = await fetch(API_BASE + '/api/continue?' + params.toString());
    if (resp.ok) {
      const data = await resp.json();
      if (data.launched) {
        showToast('Claude Code 启动中，自动继续: ' + name);
        return;
      }
    }
  } catch(e) { /* fall through */ }
  // Fallback
  if (location) {
    window.open('file:///' + location.replace(/\\/g, '/'), '_blank');
  }
  showToast('已打开项目: ' + name);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== Grid Render ==========

        <span class="card-title">${esc(p.name)}</span>
        <div style="display:flex;align-items:center;gap:4px;">

          <button class="card-del-btn" onclick="event.stopPropagation();deleteProject('${escAttr(p.id)}')" title="删除">✕</button>

// ========== Timeline Render ==========
function renderTimeline() {
  const filtered = getFiltered();
  const view = document.getElementById('timelineView');
  if (filtered.length === 0) {
    view.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">没有找到项目</div>
      <div class="empty-desc">试试修改搜索词或切换分类吧</div>
    </div>`;
    return;
  }
  const byYear = {};
  filtered.forEach(p => {
    const y = new Date(p.createdAt).getFullYear();
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(p);
  });
  const years = Object.keys(byYear).sort((a,b) => b - a);
  view.innerHTML = years.map(y => `
    <div class="timeline-year">
      <div class="timeline-year-header">${y}年 <span class="timeline-year-count">${byYear[y].length} 个项目</span></div>
      <div class="timeline-items">
        ${byYear[y].map(p => `
          <div class="timeline-item" onclick="showDetail(${JSON.stringify(p).replace(/"/g,'&quot;')})">
            <div class="timeline-date">${formatDate(p.createdAt)}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <span class="card-title">${esc(p.name)}</span>
              <span class="card-status status-${p.status}">${statusLabel(p.status)}</span>
            </div>
            <div class="card-desc">${esc(p.description || '暂无描述')}</div>
            <div class="timeline-actions">
              ${p.location ? `<button onclick="event.stopPropagation();openProjectDir('${escAttr(p.location)}')">📂 打开目录</button>` : ''}
              <button onclick="event.stopPropagation();continueProject('${escAttr(p.name)}','${escAttr(p.location||'')}')">🤖 继续开发</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderAll() { renderStats(); renderGrid(); renderTimeline(); }

function switchView(v) {
  activeView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-view="${v}"]`).classList.add('active');
  document.getElementById('projectGrid').classList.toggle('hidden', v !== 'grid');
  document.getElementById('timelineView').classList.toggle('active', v === 'timeline');
}

// ========== Helpers ==========
function esc(s) { if(!s) return ''; const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function formatDate(d) { if(!d) return '—'; const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function statusLabel(s) { const m={'completed':'已完成','in-progress':'进行中','archived':'已归档'}; return m[s]||s; }

// ========== Data Refresh ==========
let lastDataHash = '';
async function refreshData(silent) {
  const btn = document.getElementById('btnRefresh');
  if (btn) { btn.classList.add('spinning'); }
  try {
    const resp = await fetch(DATA_URL);
    if (resp.ok) {
      const data = await resp.json();
      const hash = JSON.stringify(data);
      if (hash !== lastDataHash) {
        lastDataHash = hash;
        projects = data.projects || [];
        metadata = data.metadata || {};
        renderAll();
        if (!silent) showToast('数据已刷新');
        updateLastUpdated();
      } else if (!silent) {
        showToast('数据已是最新');
      }
    }
  } catch(e) { /* server not running, use embedded */ }
  if (btn) {
    btn.classList.remove('spinning');
    clearTimeout(btn._t); btn._t = setTimeout(() => btn.classList.remove('spinning'), 100);
  }
}

function updateLastUpdated() {
  const el = document.getElementById('lastUpdated');
  if (!el) return;
  if (metadata.lastUpdated) {
    const d = new Date(metadata.lastUpdated);
    const ts = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
    el.textContent = `更新 ${ts}`;
  }
}

// ========== Form Modal ==========
function showCreateForm() {
  const overlay = document.getElementById('formModalOverlay');
  document.getElementById('formModalContent').innerHTML = buildFormHTML();
  overlay.classList.add('show');
  overlay.onclick = function(e) { if (e.target === overlay) closeFormModal(); };
  // Init tag inputs
  initTagInputs();
}

function showEditForm(projId) {
  const p = projects.find(x => x.id === projId);
  if (!p) { showToast('项目未找到'); return; }
  const overlay = document.getElementById('formModalOverlay');
  document.getElementById('formModalContent').innerHTML = buildFormHTML(p);
  overlay.classList.add('show');
  overlay.onclick = function(e) { if (e.target === overlay) closeFormModal(); };
  initTagInputs();
}

function closeFormModal() {
  document.getElementById('formModalOverlay').classList.remove('show');
}

function buildFormHTML(existing) {
  const isEdit = !!existing;
  const title = isEdit ? '编辑项目' : '新增项目';
  const btnLabel = isEdit ? '保存修改' : '创建项目';
  const idField = isEdit ? `<input type="hidden" id="formProjId" value="${escAttr(existing.id)}">` : '';
  return `
    <div style="display:flex;align-items:start;justify-content:space-between;">
      <h2>${title}</h2>
      <button class="modal-close" onclick="closeFormModal()">&times;</button>
    </div>
    <form onsubmit="submitProject(event)" style="margin-top:16px;">
      ${idField}
      <div class="form-group">
        <label>项目名称 *</label>
        <input type="text" id="formName" value="${escAttr(isEdit ? existing.name : '')}" placeholder="例如：Flask 博客系统" required>
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="formDesc" placeholder="一句话描述项目是做什么的">${esc(isEdit ? (existing.description||'') : '')}</textarea>
      </div>
      <div class="form-group">
        <label>存放路径</label>
        <input type="text" id="formLocation" value="${escAttr(isEdit ? (existing.location||'') : 'D:\\\\Claude program\\\\')}" placeholder="D:\\Claude program\\项目名">
        <div class="hint">所有项目统一存放在 D:\\Claude program\\ 下</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>状态</label>
          <select id="formStatus">
            <option value="in-progress" ${isEdit && existing.status==='in-progress'?'selected':''}>进行中</option>
            <option value="completed" ${isEdit && existing.status==='completed'?'selected':''}>已完成</option>
            <option value="archived" ${isEdit && existing.status==='archived'?'selected':''}>已归档</option>
          </select>
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="formCategory">
            ${['fullstack','frontend','backend','tool','cli','other'].map(c =>
              `<option value="${c}" ${isEdit && existing.category===c?'selected':''}>${c}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>技术栈（逗号分隔）</label>
        <div class="tag-input-wrap" data-target="formTechStack" data-init='${isEdit ? JSON.stringify(existing.techStack||[]) : '[]'}'>
          <input type="text" placeholder="输入后回车添加" onkeydown="tagInputKeydown(event, this)">
        </div>
        <div class="hint">例如：Python, React, Flask</div>
      </div>
      <div class="form-group">
        <label>标签（逗号分隔）</label>
        <div class="tag-input-wrap" data-target="formTags" data-init='${isEdit ? JSON.stringify(existing.tags||[]) : '[]'}'>
          <input type="text" placeholder="输入后回车添加" onkeydown="tagInputKeydown(event, this)">
        </div>
        <div class="hint">例如：web, blog, api</div>
      </div>
      <div class="modal-actions" style="margin-top:20px;">
        <button type="submit" class="btn-primary">${btnLabel}</button>
        <button type="button" onclick="closeFormModal()">取消</button>
      </div>
    </form>
  `;
}

// ── Tag Input Helpers ──
function initTagInputs() {
  document.querySelectorAll('.tag-input-wrap').forEach(wrap => {
    try {
      const items = JSON.parse(wrap.dataset.init || '[]');
      const target = wrap.dataset.target;
      items.forEach(t => addTagChip(wrap, target, t));
    } catch(e) { /* ignore parse errors */ }
  });
}
function tagInputKeydown(e, input) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = input.value.trim().replace(/,/g, '');
    if (val) {
      const wrap = input.closest('.tag-input-wrap');
      const target = wrap.dataset.target;
      addTagChip(wrap, target, val);
      input.value = '';
    }
  }
  if (e.key === 'Backspace' && input.value === '') {
    const wrap = input.closest('.tag-input-wrap');
    const chips = wrap.querySelectorAll('.tag-item');
    if (chips.length > 0) chips[chips.length - 1].remove();
  }
}
function addTagChip(wrap, target, text) {
  const chip = document.createElement('span');
  chip.className = 'tag-item';
  chip.innerHTML = `${esc(text)}<span class="tag-remove" onclick="this.parentElement.remove()">&times;</span>`;
  wrap.insertBefore(chip, wrap.querySelector('input'));
}
function getTagValues(wrap) {
  return Array.from(wrap.querySelectorAll('.tag-item')).map(c => c.textContent.replace('×','').trim());
}

// ── Submit ──
async function submitProject(e) {
  e.preventDefault();
  const projId = document.getElementById('formProjId');
  const isEdit = !!projId;

  const payload = {
    name: document.getElementById('formName').value.trim(),
    description: document.getElementById('formDesc').value.trim(),
    location: document.getElementById('formLocation').value.trim(),
    status: document.getElementById('formStatus').value,
    category: document.getElementById('formCategory').value,
    techStack: getTagValues(document.querySelector('[data-target="formTechStack"]')),
    tags: getTagValues(document.querySelector('[data-target="formTags"]')),
  };

  if (!payload.name) { showToast('请输入项目名称'); return; }

  const url = isEdit ? API_BASE + '/api/projects/' + projId.value : API_BASE + '/api/projects';
  const method = isEdit ? 'PUT' : 'POST';

  try {
    const resp = await fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if (resp.ok) {
      closeFormModal();
      showToast(isEdit ? '项目已更新' : '项目已创建');
      refreshData(true);
    } else {
      const err = await resp.json();
      showToast('操作失败: ' + (err.error || resp.status));
    }
  } catch(ex) {
    // Fallback: server not running, can't create
    showToast('服务器未运行，无法操作。请启动 server.py');
  }
}

// ── Delete ──
async function deleteProject(projId) {
  const p = projects.find(x => x.id === projId);
  if (!p) return;
  let msg = `确定要删除项目「${p.name}」吗？\n此操作不可撤销。`;
  if (p.location) {
    msg += `\n\n同时将删除项目目录:\n${p.location}`;
  }
  if (!confirm(msg)) return;

  try {
    const resp = await fetch(API_BASE + '/api/projects/' + projId, { method: 'DELETE' });
    if (resp.ok) {
      const data = await resp.json();
      showToast(data.deletedDir
        ? '项目及目录已删除: ' + p.name
        : '项目记录已删除（目录保留）: ' + p.name);
      refreshData(true);
    } else {
      const err = await resp.json();
      showToast('删除失败: ' + (err.error || resp.status));
    }
  } catch(ex) {
    showToast('服务器未运行，无法删除');
  }
}

// ========== Events ==========
document.getElementById('searchInput').addEventListener('input', renderAll);
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', function() {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  this.classList.add('active');
  activeFilter = this.dataset.filter;
  renderAll();
}));
document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', function() {
  switchView(this.dataset.view);
}));

// ========== Init ==========
// Load embedded data immediately, then try live API
loadData().then(() => {
  renderAll();
  updateLastUpdated();
  // Try to fetch live data from server — if reachable, replace embedded snapshot
  refreshData(true);
});
</script>
